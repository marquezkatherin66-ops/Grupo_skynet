<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reporte de trabajo · Grupo Skynet</title>
<style>
:root{--bg:#f3f8ee;--card:#fff;--ink:#12301a;--mut:#5b6e60;--g1:#0b5a1e;--g2:#6cc417;--line:#d3e2c9;--err:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:#fff;border-bottom:4px solid var(--g2);padding:14px 16px;text-align:center}
header img{max-width:100%;width:380px;height:auto;filter:drop-shadow(0 0 8px rgba(255,255,255,.95)) drop-shadow(0 2px 10px rgba(11,90,30,.25))}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.35rem;margin:6px 0 2px;color:var(--g1)}
.sub{margin:0 0 16px;color:var(--mut);font-size:.95rem}
fieldset{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px 14px 16px;margin:0 0 14px}
legend{font-weight:700;color:var(--g1);padding:0 6px}
label{display:block;font-weight:600;margin:10px 0 4px;font-size:.95rem}
input[type=text],input[type=datetime-local],textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--ink)}
textarea{min-height:120px;resize:vertical}
:focus-visible{outline:3px solid var(--g2);outline-offset:2px}
button{font:inherit;cursor:pointer;border-radius:10px;border:0;padding:11px 14px;font-weight:700}
.sec{background:transparent;border:2px solid var(--g1);color:var(--g1)}
.pri{width:100%;background:linear-gradient(180deg,var(--g2),var(--g1));color:#fff;font-size:1.1rem;padding:15px}
.row{display:flex;gap:8px}.row input{flex:1}
.techs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--bg);font-weight:500;margin:0}
.chip input{width:20px;height:20px;accent-color:var(--g1)}
.chip:has(input:checked){border-color:var(--g1);background:color-mix(in srgb,var(--g2) 22%,var(--bg))}
.loc{margin-top:8px;font-size:.9rem;color:var(--mut);word-break:break-all}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.th{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.th img{width:100%;height:100%;object-fit:cover}
.th button{position:absolute;top:4px;right:4px;width:28px;height:28px;padding:0;border-radius:50%;background:rgba(0,0,0,.65);color:#fff}
#msg{margin:12px 0 0;font-size:.92rem;color:var(--mut)}#msg.err{color:var(--err)}
@media (max-width:380px){.techs{grid-template-columns:1fr}}
.otros{display:none;margin-top:10px}.otros.on{display:block}

body{background:#d9f0cc;position:relative;min-height:100vh;overflow-x:hidden}
header{background:transparent;border:0;box-shadow:none;padding:18px 16px 4px}
fieldset{background:rgba(255,255,255,.8);box-shadow:0 4px 16px rgba(11,90,30,.12);border-color:rgba(255,255,255,.7)}
h1{color:#0b5a1e}
.sub{color:#2e5a3a}
#msg{color:#12301a}#msg.err{color:#b3261e}

.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(135deg,#e6f6dc,#cdebbd,#b9e3b2,#d6f0c8,#e6f6dc);background-size:300% 300%;animation:flujo 26s ease-in-out infinite}
.bg i{position:absolute;border-radius:50%;filter:blur(50px);opacity:.55;background:radial-gradient(circle,#f6ffe9 0%,rgba(190,235,160,0) 70%);animation:flota 19s ease-in-out infinite}
.bg i:nth-of-type(1){width:340px;height:340px;left:-80px;top:8%}
.bg i:nth-of-type(2){width:420px;height:420px;right:-120px;top:40%;animation-duration:24s;animation-delay:-6s}
.bg i:nth-of-type(3){width:300px;height:300px;left:30%;bottom:-100px;animation-duration:21s;animation-delay:-3s}
.bg canvas{position:absolute;inset:0;width:100%;height:100%}
.bg .globe{position:absolute;right:-170px;bottom:-150px;width:560px;height:560px;opacity:.85}
.bg .globe *{fill:none;stroke:#1f9a3a;stroke-width:1.6;stroke-opacity:.38}
.bg .globe .m{transform-box:fill-box;transform-origin:center;animation:meridiano 14s ease-in-out infinite}
.bg .globe .d{fill:#1f9a3a;stroke:none;fill-opacity:.8;animation:latido 3s ease-in-out infinite}
.bg .globe .arc{stroke-opacity:.6;stroke-dasharray:6 8;animation:marcha 3s linear infinite}
.bg .ico{position:absolute;width:56px;height:56px;fill:none;stroke:#1f9a3a;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:.42;animation:flota2 12s ease-in-out infinite}
@keyframes meridiano{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.02)}}
@keyframes latido{0%,100%{fill-opacity:.35}50%{fill-opacity:1}}
@keyframes marcha{to{stroke-dashoffset:-28}}
@keyframes flota2{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-22px) rotate(5deg)}}
@keyframes flujo{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes flota{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(50px,-40px) scale(1.12)}66%{transform:translate(-30px,30px) scale(.92)}}
@media (prefers-reduced-motion:reduce){.bg,.bg i,.bg .globe *,.bg .ico{animation:none!important}}
legend{float:left;width:100%;padding:0;margin:0 0 4px;font-size:1.05rem}
legend+*{clear:both}
</style>
</head>

<div class="loc" id="loc">Aún no se ha tomado la ubicación.</div>
</fieldset>

<fieldset><legend>Fotos</legend>
<input type="file" id="fotos" accept="image/*" multiple hidden>
<button type="button" class="sec" id="selF">Tomar o subir fotos</button>
<div class="thumbs" id="thumbs"></div>
</fieldset>

<button type="button" class="pri" id="send">Enviar por WhatsApp</button>
<p id="msg" role="status"></p>
</main>

<script>
// ====== CONFIGURACIÓN ======
var WHATSAPP_NUM = "50498991057";   // Número destino con código de país (504 = Honduras), sin + ni espacios
// ===========================
var $=function(id){return document.getElementById(id)};
var fotos=[], coords=null;

function pad(n){return String(n).padStart(2,"0")}
(function(){var d=new Date();$("fec").value=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes())})();

function msg(t,err){$("msg").textContent=t;$("msg").className=err?"err":""}

$("gps").onclick=function(){
  if(!navigator.geolocation){msg("Tu navegador no permite obtener la ubicación.",true);return}
  $("loc").textContent="Buscando ubicación…";
  navigator.geolocation.getCurrentPosition(function(p){
    coords={lat:p.coords.latitude,lng:p.coords.longitude};
    $("loc").textContent="Ubicación guardada: "+coords.lat.toFixed(5)+", "+coords.lng.toFixed(5);
  },function(){
    $("loc").textContent="No se pudo obtener la ubicación. Activa el GPS y da permiso, o escribe la dirección.";
  },{enableHighAccuracy:true,timeout:15000});
};

$("selF").onclick=function(){$("fotos").click()};
$("fotos").onchange=function(e){
  Array.prototype.forEach.call(e.target.files,function(f){shrink(f).then(function(b){fotos.push(b);draw()})});
  e.target.value="";
};
function shrink(file){
  return new Promise(function(ok){
    var img=new Image(),u=URL.createObjectURL(file);
    img.onload=function(){
      var s=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement("canvas");
      c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
      c.toBlob(function(b){ok(new File([b],"foto"+Date.now()+Math.floor(Math.random()*99)+".jpg",{type:"image/jpeg"}))},"image/jpeg",0.8);
    };
    img.onerror=function(){ok(file)};img.src=u;
  });
}
function draw(){
  $("thumbs").innerHTML="";
  fotos.forEach(function(f,i){
    var d=document.createElement("div");d.className="th";
    var im=document.createElement("img");im.src=URL.createObjectURL(f);im.alt="Foto "+(i+1);
    var b=document.createElement("button");b.type="button";b.textContent="×";b.setAttribute("aria-label","Quitar foto "+(i+1));
    b.onclick=function(){fotos.splice(i,1);draw()};
    d.appendChild(im);d.appendChild(b);$("thumbs").appendChild(d);
  });
}

function buildText(){
  var f=$("fec").value?new Date($("fec").value).toLocaleString("es-HN"):"";
  var L=["*REPORTE DE TRABAJO - GRUPO SKYNET*","",
    "*Empleado:* "+$("emp").value.trim(),
    "*Cliente/Dirección:* "+$("cli").value.trim(),
    "*Fecha:* "+f,"",
    "*Reporte:*",$("rep").value.trim(),""];
  var u=[];
  if(coords)u.push("https://maps.google.com/?q="+coords.lat+","+coords.lng);
  if($("dir").value.trim())u.push($("dir").value.trim());
  L.push("*Ubicación:* "+(u.length?u.join(" - "):"No indicada"));
  L.push("*Fotos adjuntas:* "+fotos.length);
  return L.join("\n");
}

$("send").onclick=function(){
  if(!$("emp").value.trim()||!$("rep").value.trim()){msg("Escribe tu nombre y el reporte antes de enviar.",true);return}
  var text=buildText();
  if(fotos.length&&navigator.canShare&&navigator.canShare({files:fotos})){
    navigator.share({files:fotos,text:text,title:"Reporte Skynet"})
      .then(function(){msg("Elige WhatsApp y el chat de la oficina para completar el envío.")})
      .catch(function(e){if(e.name!=="AbortError")msg("No se pudo compartir. Intenta de nuevo.",true)});
    return;
  }
  window.open("https://wa.me/"+WHATSAPP_NUM+"?text="+encodeURIComponent(text),"_blank");
  msg(fotos.length?"Se abrió WhatsApp con el texto. Este dispositivo no permite adjuntar fotos automáticamente: adjúntalas en el chat.":"Se abrió WhatsApp con el reporte. Presiona enviar.");
};


// ====== FONDO: red de internet ======
(function(){
  var c=document.getElementById("net");if(!c)return;
  var x=c.getContext("2d"),w,h,N=[],P=[],D=170;
  var still=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){
    var d=window.devicePixelRatio||1;w=innerWidth;h=innerHeight;
    c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0);
    var n=Math.max(28,Math.min(70,Math.round(w*h/14000)));N=[];P=[];
    for(var i=0;i<n;i++)N.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,hub:i%8===0});
    if(still)frame(true);
  }
  function frame(once){
    x.clearRect(0,0,w,h);var i,j,a,b,d;
    for(i=0;i<N.length;i++){a=N[i];if(!once){a.x+=a.vx;a.y+=a.vy;if(a.x<0||a.x>w)a.vx*=-1;if(a.y<0||a.y>h)a.vy*=-1}}
    x.lineWidth=1.3;
    for(i=0;i<N.length;i++)for(j=i+1;j<N.length;j++){
      a=N[i];b=N[j];d=Math.hypot(a.x-b.x,a.y-b.y);
      if(d<D){x.strokeStyle="rgba(30,150,60,"+((1-d/D)*.9).toFixed(3)+")";x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}
    }
    if(!once&&P.length<16&&Math.random()<.08){
      var A=Math.random()*N.length|0,C=[];
      for(j=0;j<N.length;j++)if(j!==A&&Math.hypot(N[A].x-N[j].x,N[A].y-N[j].y)<D)C.push(j);
      if(C.length)P.push({a:A,b:C[Math.random()*C.length|0],t:0,s:.012+Math.random()*.012});
    }
    x.shadowColor="#6ee07a";x.shadowBlur=10;x.fillStyle="#2fc04a";
    for(i=P.length-1;i>=0;i--){
      var p=P[i];a=N[p.a];b=N[p.b];
      x.beginPath();x.arc(a.x+(b.x-a.x)*p.t,a.y+(b.y-a.y)*p.t,3.2,0,6.283);x.fill();
      p.t+=p.s;if(p.t>=1)P.splice(i,1);
    }
    x.shadowBlur=0;
    for(i=0;i<N.length;i++){
      a=N[i];x.fillStyle="rgba(25,140,55,.85)";x.beginPath();x.arc(a.x,a.y,a.hub?4.5:2.6,0,6.283);x.fill();
      if(a.hub){x.strokeStyle="rgba(25,140,55,.5)";x.beginPath();x.arc(a.x,a.y,9,0,6.283);x.stroke()}
    }
    if(!once&&!still)requestAnimationFrame(frame);
  }
  size();addEventListener("resize",size);if(!still)frame();
})();
</script>
</body>
</html>
